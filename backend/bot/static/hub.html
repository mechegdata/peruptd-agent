<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeruPTD AI Sales Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>:root {
  /* Command-center for a sales floor: light workspace, one dark "x-ray" instrument panel, signal-orange for the AI */
  --paper: #eceff3; --surface: #ffffff; --ink: #141a26; --muted: #5d6677; --line: #d8dce4;
  --signal: #ff5a1f; --signal-soft: #fff0e9; --xray: #0f1521; --xray-line: #243047; --xray-text: #d7deea; --cyan: #44d4c4;
  --wa: #0b5e54; --wa-bubble: #d9fdd3; --wa-bg: #efe9e1; --good: #1f8a4c; --warn: #c27400; --bad: #c0362c;
  --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 18px; background: var(--ink); color: #fff; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--signal); display: grid; place-items: center; font: 700 13px var(--display); letter-spacing: .02em; }
.brand h1 { font: 600 17px var(--display); margin: 0; letter-spacing: -.01em; }
.brand small { display: block; color: #9aa6bb; font-size: 11.5px; }
.switch { display: flex; align-items: center; gap: 6px; }
.switch > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #8b97ad; }
.seg { display: inline-flex; background: #232c3d; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: #c9d1df; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 4px; padding: 8px 18px 0; background: var(--ink); }
.tabs button { border: 0; background: transparent; color: #aab4c6; padding: 9px 14px; border-radius: 9px 9px 0 0; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }
.tabs .count { font: 600 10.5px var(--mono); background: var(--signal); color: #fff; border-radius: 6px; padding: 1px 5px; margin-left: 6px; }
main { padding: 14px 18px 22px; }
.view[hidden] { display: none !important; }

/* ---------- live console grid ---------- */
.console { display: grid; grid-template-columns: minmax(330px, 1fr) minmax(400px, 1.25fr) minmax(300px, .9fr); gap: 14px; align-items: start; }
@media (max-width: 1180px) { .console { grid-template-columns: 1fr 1fr; } .console .crmcol { grid-column: 1 / -1; } }
@media (max-width: 760px) { .console { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel h2 { font: 600 13px var(--display); margin: 0; padding: 11px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.panel h2 .tag { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }

/* chat */
.phone { display: flex; flex-direction: column; height: 680px; }
.phone-head { background: var(--wa); color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #dfe7e5; color: var(--wa); display: grid; place-items: center; font-weight: 700; }
.phone-head b { display: block; font-size: 14px; }
.phone-head small { opacity: .8; font-size: 11.5px; }
.chan { margin-left: auto; display: inline-flex; background: rgba(255,255,255,.15); border-radius: 8px; padding: 2px; }
.chan button { border: 0; background: transparent; color: #fff; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; }
.chan button[aria-pressed="true"] { background: #fff; color: var(--wa); font-weight: 600; }
.status-strip { display: flex; gap: 6px; align-items: center; padding: 6px 12px; font-size: 12px; background: #f7f3ec; border-bottom: 1px solid #e6ddd0; min-height: 31px; }
.status-strip .pill { margin-left: auto; }
.msgs { flex: 1; overflow-y: auto; padding: 12px; background: var(--wa-bg); display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
.row { display: flex; animation: rise .3s ease; }
.row.me { justify-content: flex-start; } .row.bot, .row.rep { justify-content: flex-end; } .row.sys { justify-content: center; }
.bubble { max-width: 86%; padding: 7px 10px 4px; border-radius: 10px; box-shadow: 0 1px 1px rgba(0,0,0,.1); white-space: pre-line; font-size: 13.5px; }
.me .bubble { background: #fff; border-top-left-radius: 3px; }
.bot .bubble { background: var(--wa-bubble); border-top-right-radius: 3px; }
.rep .bubble { background: #fff4c7; border-top-right-radius: 3px; }
.sms .bot .bubble { background: #2f7cf6; color: #fff; } .sms .me .bubble { background: #e9e9eb; } .sms .msgs { background: #fff; }
.who { font-size: 11px; font-weight: 600; color: var(--wa); margin-bottom: 1px; }
.sms .bot .who { color: #dce9ff; }
.time { font-size: 10px; color: #667781; text-align: right; margin-top: 1px; }
.sms .bot .time { color: #dce9ff; }
.sysnote { background: #fff7d6; border: 1px solid #f0dc96; color: #6a4d00; border-radius: 8px; padding: 5px 9px; font-size: 12px; max-width: 92%; text-align: center; }
.media-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.thumb { width: 118px; border-radius: 8px; overflow: hidden; background: #fff; border: 1px solid rgba(0,0,0,.08); font-size: 11px; color: var(--ink); }
.thumb .art { height: 70px; display: grid; place-items: center; font-size: 24px; color: #fff; }
.thumb .cap { padding: 4px 6px; line-height: 1.25; }
.thumb .trg { display: block; font: 500 9.5px var(--mono); color: var(--muted); }
.typing { display: inline-flex; gap: 4px; padding: 10px 12px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: #6c8f66; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.composer { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; background: #fafafa; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.chip:hover { border-color: var(--signal); }
.chip.play { background: var(--signal); color: #fff; border-color: var(--signal); font-weight: 600; }
.chip.slot { background: var(--wa); color: #fff; border-color: var(--wa); font-weight: 600; }
.sendrow { display: flex; gap: 6px; }
.sendrow input { flex: 1; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: #fff; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 12px; font-weight: 500; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.small { padding: 4px 9px; font-size: 12px; }

/* x-ray */
.xray { background: var(--xray); color: var(--xray-text); border-color: #0b0f18; }
.xray h2 { border-color: var(--xray-line); color: #fff; }
.xray h2 .tag { color: #7d8aa3; }
.xbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 640px; }
.stage { border: 1px solid var(--xray-line); border-radius: 10px; padding: 10px 12px; position: relative; transition: border-color .3s, box-shadow .3s; }
.stage.on { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal) inset; }
.stage.done { border-color: #2c3b55; }
.stage h3 { margin: 0 0 6px; font: 600 12px var(--display); color: #fff; display: flex; gap: 8px; align-items: baseline; }
.stage h3 .n { font: 600 10.5px var(--mono); color: var(--signal); }
.stage h3 .ms { margin-left: auto; font: 500 10.5px var(--mono); color: var(--cyan); }
.muted-x { color: #7d8aa3; font-size: 12px; }
.raw { font: 12px/1.4 var(--mono); color: #aeb9cc; background: #0a0f18; border-radius: 6px; padding: 7px 9px; white-space: pre-wrap; }
.canon { font-size: 13px; color: #fff; }
.slangs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.slang { font: 11.5px var(--mono); border: 1px solid #39465f; border-radius: 6px; padding: 2px 6px; }
.slang b { color: var(--signal); font-weight: 600; } .slang em { color: var(--cyan); font-style: normal; }
.intents { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.intent { font: 600 10.5px var(--mono); background: #1c2638; border-radius: 5px; padding: 2px 6px; color: #c8d3e6; }
.intent.primary { background: var(--signal); color: #fff; }
.ents { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 8px; font: 12px var(--mono); }
.ents dt { color: #7d8aa3; } .ents dd { margin: 0; color: var(--cyan); }
.trace { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.trace li { display: grid; grid-template-columns: 112px 1fr; gap: 8px; font-size: 12px; align-items: baseline; animation: rise .3s ease both; }
.trace li b { font: 600 11px var(--mono); color: var(--signal); }
.guard { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.guard span { font: 11px var(--mono); color: #9fe3b5; }
details.json summary { cursor: pointer; font: 11px var(--mono); color: #7d8aa3; margin-top: 8px; }
details.json pre { font: 11px/1.4 var(--mono); color: #c8d3e6; background: #0a0f18; border-radius: 6px; padding: 8px; overflow-x: auto; max-height: 220px; margin: 6px 0 0; }

/* crm column */
.crmcol { display: flex; flex-direction: column; gap: 14px; }
.crmhead { color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
.crmhead b { font: 600 13px var(--display); }
.crmhead small { margin-left: auto; font: 11px var(--mono); opacity: .85; }
.fields { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 5px 8px; border-radius: 7px; font-size: 12.5px; transition: background .5s; }
.field code { font: 11.5px var(--mono); color: var(--muted); }
.field span { font-weight: 600; text-align: right; }
.field.flash { animation: flash 1.6s ease; }
.cal { padding: 10px 12px 12px; display: grid; grid-template-columns: 38px repeat(3, 1fr); gap: 2px; font-size: 11px; }
.cal .hd { font-weight: 600; text-align: center; padding-bottom: 4px; }
.cal .hr { color: var(--muted); font: 10.5px var(--mono); }
.cal .c { height: 17px; border-radius: 3px; background: #f1f3f6; }
.cal .c.busy { background: repeating-linear-gradient(135deg, #e3e6ec, #e3e6ec 4px, #f1f3f6 4px, #f1f3f6 8px); }
.cal .c.offer { background: #ffe1d4; border: 1px dashed var(--signal); }
.cal .c.booked { background: var(--good); }
.feed { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 5px; max-height: 190px; overflow-y: auto; }
.feed div { font-size: 12px; padding: 5px 8px; border-radius: 7px; background: #f6f7f9; border-left: 3px solid var(--line); animation: rise .3s ease; }
.feed div.hot { border-left-color: var(--signal); background: var(--signal-soft); }
.pill { font: 600 11px var(--body); border-radius: 999px; padding: 2px 8px; background: #e7f6ec; color: var(--good); }
.pill.warn { background: #fff1d6; color: var(--warn); } .pill.bad { background: #fde6e4; color: var(--bad); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 12px; }

/* catalog */
.syncbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
.syncbar code { font: 12px var(--mono); background: #f1f3f6; padding: 2px 6px; border-radius: 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px #d6f0df; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card header { display: flex; gap: 10px; align-items: flex-start; }
.card h3 { margin: 0; font: 600 15px var(--display); text-wrap: balance; }
.card header small { color: var(--muted); font: 11px var(--mono); }
.card header .pill { margin-left: auto; white-space: nowrap; }
.specs { display: flex; flex-wrap: wrap; gap: 5px; }
.specs span { font-size: 12px; background: #f3f5f8; border-radius: 6px; padding: 2px 7px; }
.grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid6 label, .card label.wide { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.grid6 label { min-width: 0; }
.grid6 input { width: 100%; min-width: 0; }
.grid6 input, .card textarea { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 13px var(--body); color: var(--ink); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.card textarea { resize: vertical; min-height: 44px; }
.mediagrid { display: flex; flex-wrap: wrap; gap: 8px; }
.mediagrid .thumb { width: 128px; }
.addmedia { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.addmedia select { border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; }

/* pipeline */
.board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: #e2e6ec; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 360px; }
.col h3 { margin: 2px 4px 2px; font: 600 12px var(--display); display: flex; justify-content: space-between; }
.col h3 span { font: 11px var(--mono); color: var(--muted); }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%; }
.lead:hover { border-color: var(--signal); }
.lead.live { border: 2px solid var(--signal); }
.lead b { font-size: 13px; }
.lead .meta { color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.strikes { display: inline-flex; gap: 2px; } .strikes i { width: 7px; height: 7px; border-radius: 50%; background: #d4d9e2; } .strikes i.on { background: var(--signal); }
.detail { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .detail { grid-template-columns: 1fr; } }
.timeline { list-style: none; margin: 0; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 0; }
.timeline li { display: grid; grid-template-columns: 22px 150px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
.timeline .ic { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 10px; }
.timeline .done .ic { background: var(--good); border-color: var(--good); color: #fff; }
.timeline .next .ic { border-color: var(--signal); background: var(--signal-soft); }
.timeline .skip { opacity: .45; text-decoration: line-through; }
.timeline .when { font: 600 12px var(--mono); }

@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@keyframes flash { 0% { background: #c9f1d5; } 100% { background: transparent; } }

/* live api mode */
.mode { border: 1px solid #3a4558; background: transparent; color: #c9d1df; border-radius: 9px; padding: 6px 10px; font: 600 11.5px var(--mono); }
.mode.on { background: #133d2a; border-color: #2c8a5a; color: #9ff0c3; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.live-panel { position: fixed; top: 64px; right: 18px; z-index: 20; width: min(380px, calc(100% - 36px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(20,26,38,.25); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.live-panel h3 { margin: 0; font: 600 14px var(--display); }
.live-panel label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.live-panel input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: 13px var(--body); text-transform: none; letter-spacing: 0; color: var(--ink); }
.live-panel .controls { padding: 0; }
.live-msg { margin: 0; font-size: 12.5px; }
.live-note { margin: 0; font-size: 11.5px; color: var(--muted); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 9px; font-size: 13px; z-index: 30; animation: rise .25s ease; }
.toast.bad { background: var(--bad); }

/* ---------- PeruPTD Native CRM (/app) ---------- */
.crm-mode .top .btn { background: transparent; color: #fff; border-color: #3a465c; }
.muted { color: var(--muted); }
.pad { padding: 12px 14px; }
.btn.tiny { padding: 1px 6px; font-size: 11px; }
.tag { display: inline-block; font: 600 10.5px var(--mono); background: #eef1f5; color: var(--ink); border-radius: 6px; padding: 1px 6px; width: max-content; }
.tag.bad { background: #fde8e6; color: var(--bad); }
.crm-login { max-width: 360px; margin: 8vh auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.crm-login h2 { border: 0; padding: 0; font-size: 18px; }
.crm-login label, .crm-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.crm-login input, .crm-form input, .crm-form select, .crm-form textarea, .crm-send textarea, .crm-media select {
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: 13px var(--body); color: var(--ink); text-transform: none; letter-spacing: 0; background: #fff; }
.crm-error { color: var(--bad); min-height: 1.2em; margin: 0; }
.crm-pipeline { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 14px; align-items: start; }
.crm-pipeline .board { grid-template-columns: repeat(5, minmax(160px, 1fr)); }
@media (max-width: 1100px) { .crm-pipeline { grid-template-columns: 1fr; } }
.lead.hot { border-left: 4px solid var(--bad); }
.crm-chat { position: sticky; top: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 140px); }
.crm-chat h2 small { font: 400 11.5px var(--body); }
.crm-chat .controls { border-bottom: 1px solid var(--line); }
.crm-thread { flex: 1; overflow-y: auto; padding: 12px; background: var(--wa-bg); display: flex; flex-direction: column; gap: 8px; min-height: 240px; }
.crm-thread .msg { max-width: 86%; border-radius: 10px; padding: 7px 10px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.crm-thread .msg.out { align-self: flex-end; background: var(--wa-bubble); }
.crm-thread .msg.o-asesor { background: #e6efff; }
.crm-thread .msg.o-seguimiento { background: #fff6d8; }
.crm-thread .who { font-size: 10.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
.crm-thread .engine { font: 600 10px var(--mono); background: var(--xray); color: var(--cyan); border-radius: 5px; padding: 1px 5px; }
.crm-thread time { margin-left: auto; }
.crm-thread .txt { white-space: pre-wrap; }
.crm-send { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); align-items: flex-end; }
.crm-send textarea { flex: 1; resize: vertical; }
.crm-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
.crm-item { padding: 12px 14px; }
.crm-item h3 { margin: 0 0 4px; font: 600 14px var(--display); }
.crm-item p { margin: 2px 0; }
.crm-item .controls { padding: 8px 0 0; }
.crm-form { padding: 16px; margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.crm-form h3 { margin: 0; font: 600 15px var(--display); }
.crm-form .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.crm-form .grid.two { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.crm-form .controls { padding: 0; }
.crm-form details { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.crm-form details label { margin-top: 8px; }

  { key: "d10", when: { en: "Day 10", es: "Día 10" }, what: { en: "Closing bonus + call alert", es: "Bono de cierre + alerta de llamada" } },
  { key: "d14", when: { en: "Day 14", es: "Día 14" }, what: { en: "Release hold & close file", es: "Liberar separación y cerrar ficha" } }
];

// ===== Layer 1 · Semantic NLU (demo build): slang/typo lexicon + intent & entity extraction, ES/EN/Spanglish =====
const NLU = (() => {
  const strip = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const fmt = (n) => n.toLocaleString("en-US");

  function detectLanguage(text, previous) {
    const t = " " + strip(text).replace(/[^a-z0-9ñ' ]/g, " ") + " ";
    let es = 0, en = 0;
    for (const w of LEXICON.senales_idioma.es) if (t.includes(" " + strip(w) + " ")) es += 1;
    for (const w of LEXICON.senales_idioma.en) if (t.includes(" " + strip(w) + " ")) en += 1;
    for (const tok of t.trim().split(/\s+/)) {
      if (LEXICON.es[tok] && !LEXICON.en[tok]) es += 0.6;
      if (LEXICON.en[tok] && !LEXICON.es[tok]) en += 0.6;
    }
    if (/[ñ¿¡]|ción\b/.test(text)) es += 1;
    if (es === en) return previous || "es";
    return es > en ? "es" : "en";
  }

  // numbers like 25k, 25 mil, 2 lucas, $25,000, 2k
  function extractBudget(raw, slang) {
    const t = strip(raw);
    let m = t.match(/(\d+(?:[.,]\d+)?)\s*(lucas|luca)\b/);
    if (m) { slang.push(`${m[1]} ${m[2]} (${fmt(Math.round(parseFloat(m[1].replace(",", ".")) * 1000))})`); return Math.round(parseFloat(m[1].replace(",", ".")) * 1000); }
    m = t.match(/(\d+(?:[.,]\d+)?)\s*k\b/);
    if (m) { slang.push(`${m[1]}k (${fmt(Math.round(parseFloat(m[1]) * 1000))})`); return Math.round(parseFloat(m[1].replace(",", ".")) * 1000); }
    m = t.match(/(\d+(?:[.,]\d+)?)\s*mil\b/);
    if (m) return Math.round(parseFloat(m[1].replace(",", ".")) * 1000);
    m = t.match(/(?:\$|us\$|usd\s*)\s?(\d{1,3}(?:,\d{3})+|\d{3,})/);
    if (m) return parseInt(m[1].replace(/,/g, ""), 10);
    m = t.match(/\b(?:tengo|got|budget(?: is)?(?: like)?|presupuesto(?: de)?|cuento con)\s+(\d{3,})/);
    if (m) return parseInt(m[1], 10);
    return null;
  }

  function extractTime(raw, slang) {
    const t = strip(raw);
    let m = t.match(/(?:tipo|a las|como a las|round|around|at|@)\s*(\d{1,2})(?::(\d{2}))?\s*(y media|y cuarto|ish|pm|am|p\.m\.|de la tarde|de la noche)?/);
    if (!m) m = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(pm|am|ish|y media)\b/);
    if (!m) return null;
    let h = parseInt(m[1], 10), min = m[2] ? parseInt(m[2], 10) : 0;
    const suf = m[3] || "";
    if (suf === "y media") min = 30;
    if (suf === "y cuarto") min = 15;
    if (suf.includes("ish")) slang.push(`${m[1]}ish (≈ ${h}:00)`);
    if (suf.startsWith("am")) { /* keep */ } else if (h >= 1 && h <= 7) h += 12;
    else if (/pm|tarde|noche/.test(suf) && h < 12) h += 12;
    if (h > 23) return null;
    return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
  }

  function relativeDate(t) {
    if (/\b(manana|tomorrow)\b/.test(t)) return "TOMORROW";
    if (/\b(hoy|today|tonight|esta noche)\b/.test(t)) return "TODAY";
    if (/\b(sabado|saturday)\b/.test(t)) return /\bthis\b|\beste\b/.test(t) || true ? "THIS_SATURDAY" : "SATURDAY";
    if (/\b(domingo|sunday)\b/.test(t)) return "THIS_SUNDAY";
    if (/\b(lunes|monday)\b/.test(t)) return "MONDAY";
    return null;
  }

  function expand(raw, lang, slang) {
    const dict = LEXICON[lang];
    for (const [from, to] of Object.entries((LEXICON.frases || {})[lang] || {})) {
      const re = new RegExp(`\\b${from}\\b`, "gi");
      if (re.test(raw)) { raw = raw.replace(re, to); if (!/^(q tal|a cuanto sale)$/.test(from)) slang.push(`${from} (${to})`); }
    }
    const out = raw.replace(/[A-Za-zÁÉÍÓÚáéíóúñÑ0-9'/]+/g, (tok) => {
      const key = strip(tok);
      if (/^\d+k$/.test(key) || /^\d+$/.test(key)) return tok;
      const rep = dict[key];
      if (rep && strip(rep) !== key) { slang.push(`${tok} (${rep})`); return rep; }
      if (rep && rep !== tok && strip(rep) === key) return rep; // accent fix only
      return tok;
    });
    return out;
  }

  const INTENTS = [
    ["NOT_INTERESTED", /\b(no me interesa|ya no|not interested|no thanks|stop)\b/],
    ["SLOT_SELECTION", /^\s*(?:opcion |option |la |the )?(1|2|3|primera|segunda|tercera|first|second|third)(?: one| opcion| option)?\s*[.!]?\s*$/],
    ["RESCHEDULE", /\b(reprogram|cambiar la (cita|hora)|reschedule|move (my|the) (appointment|tour))/],
    ["GREETING", /^(hola|buenas|hey|hi|hello|buenos dias|buenas tardes)\b/],
    ["CASH_DISCOUNT", /\b(contado|cash|al contado|pago unico|paid in full)\b/],
    ["PRICE_INQUIRY", /\b(cuanto|precio|cuesta|sale|how much|price|pricing|cost|hm)\b/],
    ["OBJECTION_EXPENSIVE", /\b(caro|carisimo|expensive|too much|pricey|out of my budget|muy alto)\b/],
    ["FINANCING_CALCULATION", /\b(cuotas?|financ\w*|credito|inicial|payment plans?|monthly|down payment|\bdown\b|installments?|plazos?)\b/],
    ["BUDGET_STATEMENT", /\b(tengo|got|budget|presupuesto|cuento con|only have|solo tengo)\b/],
    ["INSURANCE_INQUIRY", /\b(seguro|insurance|ppo|hmo|delta dental|cigna|metlife)\b/],
    ["SPECS_AND_PLANS", /\b(planos?|floor ?plans?|pdf|ficha|brochure|specs?|guia|guide|sla|technical sheet|blueprints?)\b/],
    ["VIDEO_TOUR", /\b(video|recorrido|walkthrough|tour video|demo video)\b/],
    ["LOCATION_INQUIRY", /\b(donde|ubicacion|ubicados|direccion|where|located|location|address)\b/],
    ["SCHEDULE_REQUEST", /\b(ver|visita|visitar|cita|agendar|tour|visit|appointment|book|call|reunion|puedo el|free this|se podra)\b/],
    ["COURTESY_WAIT", /\b(lo pienso|te aviso|let me think|i'll let you know|despues te escribo)\b/]
  ];

  function normalize(raw, opts) {
    const t0 = performance.now();
    const items = (opts && opts.items) || [];
    const lang = detectLanguage(raw, opts && opts.previousLanguage);
    const slang = [];
    const budget = extractBudget(raw, slang);
    const time = extractTime(raw, slang);
    let clean = expand(raw, lang, slang).replace(/\s+/g, " ").replace(/\?{2,}/g, "?").trim();
    clean = clean.replace(/(\d+(?:[.,]\d+)?)\s*(lucas?|k)\b/gi, (_, n) => fmt(Math.round(parseFloat(n.replace(",", ".")) * 1000)));
    clean = clean.charAt(0).toUpperCase() + clean.slice(1);
    const t = strip(clean) + " " + strip(raw);

    const intents = [];
    for (const [name, re] of INTENTS) if (re.test(name === "SLOT_SELECTION" || name === "GREETING" ? strip(raw).trim() : t)) intents.push(name);
    if (budget && !intents.includes("BUDGET_STATEMENT")) intents.push("BUDGET_STATEMENT");
    if (intents.length === 0) intents.push("GENERAL_INFO");

    const ent = {};
    const svc = items.find((it) => it.keywords.some((k) => new RegExp(`\\b${strip(k).replace(/[-]/g, "[- ]?")}\\b`).test(t)));
    if (svc) { ent.service_keyword = svc.keywords.find((k) => new RegExp(`\\b${strip(k)}\\b`).test(t)) || svc.keywords[0]; ent.catalog_item_id = svc.id; }
    if (intents.includes("CASH_DISCOUNT")) ent.payment_type = "CASH";
    else if (intents.includes("FINANCING_CALCULATION")) ent.payment_type = "FINANCING";
    if (intents.includes("INSURANCE_INQUIRY")) ent.insurance = (t.match(/delta dental|cigna|metlife|ppo|hmo/) || [lang === "es" ? "seguro" : "insurance"])[0];
    if (budget) { ent.budget_amount = budget; ent.budget_currency = "LOCAL_OR_UNSPECIFIED"; }
    if (intents.includes("OBJECTION_EXPENSIVE")) ent.price_objection = true;
    const rel = relativeDate(t);
    if (rel) ent.proposed_date_relative = rel;
    if (time) ent.proposed_time = time;
    if (/saliendo de(l)? (la chamba|trabajo|trabajar)|after work|despues del trabajo|salgo del trabajo/.test(t)) {
      const [h, m] = (time || "18:00").split(":").map(Number);
      const end = h * 60 + m - 30;
      ent.work_end_constraint = `${String(Math.floor(end / 60)).padStart(2, "0")}:${String(end % 60).padStart(2, "0")}`;
    }
    const after = t.match(/\bafter (\d{1,2})\b|\bdespues de las (\d{1,2})\b/);
    if (after && !ent.work_end_constraint) { const h = parseInt(after[1] || after[2], 10); ent.work_end_constraint = `${(h < 8 ? h + 12 : h)}:00`; }
    const sel = strip(raw).trim().match(/^(?:opcion |option |la |the )?(1|2|3|primera|segunda|tercera|first|second|third)/);
    if (intents.includes("SLOT_SELECTION") && sel) ent.selected_slot_index = { "1": 1, "2": 2, "3": 3, primera: 1, segunda: 2, tercera: 3, first: 1, second: 2, third: 3 }[sel[1]];

    const order = ["SCHEDULE_REQUEST", "OBJECTION_EXPENSIVE", "FINANCING_CALCULATION", "PRICE_INQUIRY"];
    let primary = intents[0];
    if (intents.includes("SCHEDULE_REQUEST") && intents.includes("OBJECTION_EXPENSIVE")) primary = "SCHEDULE_AND_PRICE_OBJECTION";
    else if (intents.includes("FINANCING_CALCULATION") && intents.includes("SCHEDULE_REQUEST")) primary = "FINANCING_AND_SCHEDULE";
    else primary = order.find((o) => intents.includes(o)) || intents[0];

    return {
      detected_language: lang,
      regional_slang_detected: [...new Set(slang)],
      canonical_meaning: clean,
      primary_intent: primary,
      secondary_intents: intents.filter((i) => i !== primary),
      extracted_entities: ent,
      _ms: Math.max(1, Math.round(performance.now() - t0))
    };
  }

  return { normalize, detectLanguage, strip };
})();

// ===== Layer 2 · Deterministic engines (catalog, budget/financing, 3-strike objections, agenda, media) =====
// ===== Layer 3 · Bilingual composer. No number in a reply is invented: everything comes from the catalog item. =====
const Engines = (() => {
  const money = (n, lang) => (lang === "es" ? "US$" : "$") + Math.round(n).toLocaleString("en-US");
  const L = (lang, en, es) => (lang === "es" ? es : en);

  function annuity(principal, annualPct, months) {
    if (!annualPct) return principal / months;
    const r = annualPct / 100 / 12;
    return (principal * r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
  }

  // ---------- budget & financing ----------
  function budgetEngine(item, budget, payType, lang) {
    const cash = item.cash_price, list = item.list_price;
    const months = Math.max(1, Math.round(item.max_term_years * 12));
    if (budget == null) {
      if (payType !== "FINANCING") return null;
      const down = list * (item.rec_down_pct || 0) / 100;
      const m = annuity(list - down, item.annual_rate_pct, months);
      return { rule: "financing_plan", text: L(lang,
        `Payment plan: ${item.rec_down_pct}% down (${money(down, lang)}) and ~${money(m, lang)}/mo for ${months} months${item.annual_rate_pct ? ` (${item.annual_rate_pct}% APR est.)` : " at 0%"}.`,
        `Plan de pagos: ${item.rec_down_pct}% de inicial (${money(down, lang)}) y ~${money(m, lang)}/mes por ${months} meses${item.annual_rate_pct ? ` (TEA ref. ${item.annual_rate_pct}%)` : " sin intereses"}.`),
        calc: { down, monthly: Math.round(m), months } };
    }
    const gap = (cash - budget) / cash;
    if (gap <= 0) return { rule: "≥ cash price", text: L(lang, `Your ${money(budget, lang)} covers the cash price (${money(cash, lang)}) ✅ ${item.promo.en}.`, `Con ${money(budget, lang)} cubres el precio al contado (${money(cash, lang)}) ✅ ${item.promo.es}.`) };
    if (gap <= 0.08) return { rule: `${Math.round(gap * 100)}% below cash (≤ 8%)`, text: L(lang,
      `You're only ${Math.round(gap * 100)}% away from the cash price (${money(cash, lang)}) — that's close enough to talk it over in person 🤝`,
      `Estás a solo ${Math.round(gap * 100)}% del precio al contado (${money(cash, lang)}): eso se conversa en la reunión 🤝`) };
    if (gap <= 0.2) {
      const diff = cash - budget;
      return { rule: `${Math.round(gap * 100)}% below cash (8–20%)`, text: L(lang,
        `You can pay ${money(budget, lang)} now and cover the remaining ${money(diff, lang)} in 12 short installments of ~${money(diff / 12, lang)}.`,
        `Puedes dar ${money(budget, lang)} ahora y cubrir los ${money(diff, lang)} restantes en 12 cuotas cortas de ~${money(diff / 12, lang)}.`) };
    }
    const minDown = list * item.min_down_pct / 100;
    if (budget >= minDown) {
      const loan = list - budget, m = annuity(loan, item.annual_rate_pct, months);
      return { rule: `down payment ${Math.round((budget / list) * 100)}% ≥ ${item.min_down_pct}% min`, text: L(lang,
        `With ${money(budget, lang)} down (${Math.round((budget / list) * 100)}%), you'd finance ${money(loan, lang)}: ~${money(m, lang)}/mo over ${item.max_term_years} years (${item.annual_rate_pct}% APR est.).`,
        `Con ${money(budget, lang)} de inicial (${Math.round((budget / list) * 100)}%), financias ${money(loan, lang)}: ~${money(m, lang)}/mes a ${item.max_term_years} años (TEA ref. ${item.annual_rate_pct}%).`),
        calc: { down: budget, loan, monthly: Math.round(m), months } };
    }
    return { rule: `below ${item.min_down_pct}% minimum down`, text: L(lang,
      `The minimum down payment is ${item.min_down_pct}% (${money(minDown, lang)}). We can plan how to get there, or look at a lower-priced option.`,
      `La inicial mínima es ${item.min_down_pct}% (${money(minDown, lang)}). Podemos ver cómo llegar o revisar una opción más económica.`) };
  }

  // ---------- 3-strike objection ladder ----------
  function objectionEngine(item, strike, lang, ind) {
    if (strike === 1) return { strike, alert: L(lang, `Price objection 1/3 handled (${item.name.en}) — FYI`, `Objeción de precio 1/3 atendida (${item.name.es}) — para tu información`), media: "PRICE_OBJECTION", text: L(lang,
      `Totally fair to compare 🙂 ${item.value.en}.`, `Es normal comparar 🙂 ${item.value.es}.`) };
    if (strike === 2) return { strike, alert: L(lang, "Price objection 2/3 — good time to call this lead", "Objeción de precio 2/3 — buen momento para llamarle"), text: L(lang,
      `No pressure at all — come see it in person, zero commitment. Most people decide once they see it.`,
      `Sin compromiso: ven a verlo en persona. La mayoría decide recién cuando lo ve.`) };
    return { strike: 3, alert: L(lang, `URGENT: price objection 3/3 — escalated to ${ind.advisor}`, `URGENTE: objeción de precio 3/3 — escalado a ${ind.advisor}`), text: L(lang,
      `I understand. I've asked ${ind.advisor} to personally review options for you — they'll reach out today.`,
      `Te entiendo. Le pedí a ${ind.advisor} que revise personalmente opciones para ti; te escribe hoy.`) };
  }

  // ---------- agenda (fake but realistic busy calendar) ----------
  const BUSY = new Set(["+1|19:00", "+2|10:00"]);
  function dayOffset(rel) {
    const now = new Date();
    if (rel === "TOMORROW") return 1;
    if (rel === "TODAY") return 0;
    if (rel === "THIS_SATURDAY") return ((6 - now.getDay() + 7) % 7) || 7;
    if (rel === "THIS_SUNDAY") return ((7 - now.getDay()) % 7) || 7;
    if (rel === "MONDAY") return ((8 - now.getDay()) % 7) || 7;
    return 1;
  }
  const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
  const toHHMM = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;

  function slotLabel(slot, lang) {
    const d = new Date(); d.setDate(d.getDate() + slot.off);
    const day = d.toLocaleDateString(lang === "es" ? "es-PE" : "en-US", { weekday: "short", day: "numeric", month: "short" });
    const [h, m] = slot.time.split(":").map(Number);
    const t = new Date(2000, 0, 1, h, m).toLocaleTimeString(lang === "es" ? "es-PE" : "en-US", { hour: "numeric", minute: "2-digit" });
    const rel = slot.off === 1 ? L(lang, "Tomorrow", "Mañana") : day.charAt(0).toUpperCase() + day.slice(1);
    return `${rel} · ${t}`;
  }

  function agendaEngine(ent, lang) {
    const off = dayOffset(ent.proposed_date_relative);
    const earliest = ent.work_end_constraint ? toMin(ent.work_end_constraint) + 30 : 9 * 60;
    const want = ent.proposed_time ? Math.max(toMin(ent.proposed_time), earliest) : Math.max(earliest, 10 * 60);
    const slots = [], skipped = [];
    for (let t = want; slots.length < 2 && t <= 20 * 60; t += 30) {
      const s = { off, time: toHHMM(t) };
      if (BUSY.has(`+${off}|${s.time}`)) { skipped.push(s.time); continue; }
      slots.push(s);
    }
    const alt = { off: off + 1, time: toHHMM(Math.max(want, 10 * 60)) };
    if (BUSY.has(`+${alt.off}|${alt.time}`)) alt.time = toHHMM(toMin(alt.time) + 60);
    slots.push(alt);
    return { slots, skipped, earliest: toHHMM(earliest) };
  }

  // ---------- media (max 2, never repeated) ----------
  function mediaEngine(item, triggers, sentIds) {
    const picked = [];
    for (const trig of triggers) {
      for (const m of item.media) {
        if (picked.length >= 2) break;
        if (m.trigger === trig && !sentIds.includes(m.id) && !picked.includes(m)) { picked.push(m); break; }
      }
    }
    return picked;
  }

  // ---------- pipeline ----------
  function run(nlu, ctx) {
    const { lead, industry: ind, lang } = ctx;
    const ent = nlu.extracted_entities, intents = [nlu.primary_intent, ...nlu.secondary_intents];
    const has = (i) => intents.some((x) => x.includes(i));
    const item = ind.items.find((i) => i.id === (ent.catalog_item_id || lead.interested_catalog_item_id)) || ind.items[0];
    const trace = [], parts = [], triggers = [], crm = {}, alerts = [];
    let slots = null, booked = null;
    lead.interested_catalog_item_id = item.id;
    crm.item = item.name[lang];

    if (has("NOT_INTERESTED")) {
      trace.push(["Courtesy", L(lang, "closes politely, stops follow-up", "cierra con cortesía, detiene el seguimiento")]);
      lead.stage = "lost";
      return { text: L(lang, "No problem at all, thanks for your time! If anything changes, I'm here 🙌", "¡Sin problema, gracias por tu tiempo! Si algo cambia, aquí estoy 🙌"), media: [], trace, crm: { stage: "lost" }, alerts };
    }

    if (has("SLOT_SELECTION") && lead.offered_slots && ent.selected_slot_index) {
      const s = lead.offered_slots[ent.selected_slot_index - 1];
      if (s) {
        booked = { ...s, label: slotLabel(s, lang) };
        lead.appointment = booked; lead.stage = "booked"; lead.offered_slots = null;
        trace.push(["Agenda", L(lang, `slot ${ent.selected_slot_index} free → event created`, `opción ${ent.selected_slot_index} libre → evento creado`)]);
        parts.push(L(lang, `Booked! ✅ Your ${ind.eventWord.en.toLowerCase()}: ${booked.label}\n📍 ${ind.location.en} — ${ind.mapsUrl}\nI'll confirm with you 24h before.`,
          `¡Listo! ✅ Agendé tu ${ind.eventWord.es.toLowerCase()}: ${booked.label}\n📍 ${ind.location.es} — ${ind.mapsUrl}\nTe confirmo 24 h antes.`));
        triggers.push("LOCATION_FACADE");
        crm.stage = "booked"; crm.appointment = booked.label;
        alerts.push(L(lang, `New ${ind.eventWord.en.toLowerCase()}: ${booked.label}`, `Nueva ${ind.eventWord.es.toLowerCase()}: ${booked.label}`));
      }
    }

    if (!booked && (has("GREETING") || has("PRICE") || has("CASH") || has("GENERAL_INFO") || !lead.greeted)) {
      const hi = !lead.greeted ? L(lang, `Hi! I'm ${ind.botName.en} from ${ind.company} 👋 `, `¡Hola! Soy ${ind.botName.es} de ${ind.company} 👋 `) : "";
      lead.greeted = true;
      const specs = Object.entries(item.specs[lang]).slice(0, 4).map(([k, v]) => `${k}: ${v}`).join(" · ");
      let price = "";
      if (has("PRICE") || has("CASH")) price = has("CASH")
        ? L(lang, ` Cash price: ${money(item.cash_price, lang)} (list ${money(item.list_price, lang)}).`, ` Al contado: ${money(item.cash_price, lang)} (precio de lista ${money(item.list_price, lang)}).`)
        : L(lang, ` It's ${money(item.list_price, lang)}, or ${money(item.cash_price, lang)} paying cash.`, ` Cuesta ${money(item.list_price, lang)}, o ${money(item.cash_price, lang)} al contado.`);
      parts.push(`${hi}*${item.name[lang]}* — ${specs}.${price}`);
      trace.push(["Catalog", `${item.external[ctx.crmKey]} · ${L(lang, "list", "lista")} ${money(item.list_price, lang)} · ${L(lang, "cash", "contado")} ${money(item.cash_price, lang)}`]);
      if (!lead.sent_media_ids.length) triggers.push("FIRST_INFO");
    }

    if (ent.price_objection) {
      lead.price_objection_count = Math.min(3, (lead.price_objection_count || 0) + 1);
      const o = objectionEngine(item, lead.price_objection_count, lang, ind);
      parts.push(o.text);
      if (o.media) triggers.unshift(o.media);
      alerts.push(o.alert);
      trace.push([`Objection ${o.strike}/3`, o.alert]);
      crm.objections = lead.price_objection_count;
    }

    if (ent.budget_amount != null || ent.payment_type === "FINANCING") {
      const b = budgetEngine(item, ent.budget_amount ?? null, ent.payment_type, lang);

const LIVE_KEYS = { t45: "post_45m", d2: "post_48h", d5: "post_dia5", d10: "post_dia10", d14: "post_dia14" };
function protocolState(l, key) {
  const order = ["t24", "t75", "t45", "d2", "d5", "d10", "d14"];
  if (l.remote) {
    if (l.noshow && order.indexOf(key) >= 2) return "skip";
    const visto = ["visited", "negotiation", "won"].includes(l.stage);
    if (key === "t24" || key === "t75") return visto ? "done" : (l.stage === "booked" && key === "t24" ? "next" : "");
    if ((l.followup || []).includes(LIVE_KEYS[key])) return "done";
    const primera = order.slice(2).find((k) => !(l.followup || []).includes(LIVE_KEYS[k]));
    return visto && l.stage !== "won" && primera === key ? "next" : "";
  }
  const done = { new: 0, qualified: 0, booked: 0, visited: 3, negotiation: 6, won: 7 }[l.stage] || 0;
  const dayDone = l.stage === "visited" ? Math.min(7, 3 + ((l.day >= 2) + (l.day >= 5))) : done;
  const i = order.indexOf(key);
  if (l.noshow && i >= 2) return "skip";
  if (l.stage === "won" && i >= dayDone) return "skip";
  if (i < dayDone) return "done";
  if (i === dayDone && ["booked", "visited", "negotiation"].includes(l.stage)) return "next";
  return "";
}

      el("div", { class: "controls" }, esAdmin() ? el("button", { class: "btn primary small", type: "submit" }, x("save")) : null,

      it.nuevo ? null : archivos(it));
    form.querySelector('[data-k="filter_questions"]').value = preguntas;
    form.querySelector('[data-k="keywords"]').value = (it.keywords || []).join(", ");
    return form;
  }

  function archivos(it) {
    const rol = el("select", { id: "crm-role", "aria-label": x("role") }, ...ROLES.map((r) => el("option", { value: r }, r)));
    const archivo = el("input", { type: "file", id: "crm-file", accept: "image/jpeg,image/png,image/webp,application/pdf,video/mp4,video/quicktime" });
    const leyenda = el("input", { type: "text", id: "crm-caption", placeholder: x("caption"), maxlength: 500 });
    const subir = async () => {
      if (!archivo.files[0]) return;
      const fd = new FormData(); fd.append("file", archivo.files[0]); fd.append("role", rol.value); fd.append(C.lang === "es" ? "caption_es" : "caption_en", leyenda.value);
      try { await api(`/api/hub/catalogo/${it.id}/media`, { method: "POST", body: fd }); aviso(x("saved")); await cargarCatalogo(); C.editando = JSON.parse(JSON.stringify(C.items.find((y) => y.id === it.id))); pintar(); }
      catch (e) { aviso(e.message, true); }
    };
    return el("section", { class: "crm-media" }, el("h4", {}, x("files")),
      (it.media || []).length ? el("ul", {}, ...it.media.map((m) => el("li", {}, el("span", { class: "tag" }, m.trigger_moment), " ",
        el("a", { href: m.file_url, target: "_blank", rel: "noopener" }, m.caption_es || m.caption_en || m.media_type), " ",
        esAdmin() ? el("button", { class: "btn tiny", type: "button", onclick: async () => { try { await api(`/api/hub/catalogo/${it.id}/media/${m.id}`, { method: "DELETE" }); await cargarCatalogo(); C.editando = JSON.parse(JSON.stringify(C.items.find((y) => y.id === it.id))); pintar(); } catch (e) { aviso(e.message, true); } } }, "✕") : null)))
        : el("p", { class: "muted" }, x("noFiles")),
      esAdmin() ? el("div", { class: "controls" }, el("label", {}, x("role"), rol), archivo, leyenda, el("button", { class: "btn small", type: "button", onclick: subir }, x("upload"))) : null);
  }

  // ---------------- settings ----------------
  function vistaAjustes() {
    const caja = el("div", { class: "muted" }, "…");
    (C.ajustes ? Promise.resolve(C.ajustes) : api("/api/hub/playbook")).then((a) => { C.ajustes = a; caja.replaceWith(formAjustes(a)); }).catch((e) => { caja.textContent = e.message; });
    return caja;
  }

  function formAjustes(a) {
    const L = C.lang === "es"; const ro = !esAdmin();
    const inp = (id, valor, extra = {}) => el("input", { id, value: valor ?? "", disabled: ro, ...extra });
    const seg = ["es", "en"].map((idi) => el("details", {}, el("summary", {}, (L ? "Textos de seguimiento " : "Follow-up texts ") + idi.toUpperCase()),
      ...Object.entries(a.seguimiento[idi]).map(([k, v]) => el("label", {}, k, el("textarea", { "data-seg": `${idi}.${k}`, rows: 3, disabled: ro }, v)))));
    const form = el("form", { class: "panel crm-form", onsubmit: async (e) => {
      e.preventDefault();
      const d = { owner_whatsapp: $("#s-owner").value, bot_name: $("#s-bot").value, advisor_name: $("#s-adv").value, address: $("#s-addr").value,
        default_language: $("#s-lang").value, quiet_hours: { start: $("#s-q1").value, end: $("#s-q2").value },
        visiting_hours: { inicio: $("#s-v1").value, fin: $("#s-v2").value, dias: DIAS.filter((dd) => $(`#s-d-${dd}`).checked) },
        forbidden_phrases: $("#s-forb").value, seguimiento: { es: {}, en: {} } };
      form.querySelectorAll("[data-seg]").forEach((t) => { const [idi, k] = t.dataset.seg.split("."); if (t.value !== a.seguimiento[idi][k]) d.seguimiento[idi][k] = t.value; });
      if ($("#s-map")) { try { d.crm_field_mapping = JSON.parse($("#s-map").value || "{}"); } catch (err) { return aviso("JSON: " + err.message, true); } }
      try { C.ajustes = await api("/api/hub/playbook", { method: "PUT", body: JSON.stringify(d) }); aviso(x("saved")); pintar(); } catch (err) { aviso(err.message, true); }
    } },
      el("h3", {}, x("settings"), ro ? el("small", { class: "muted" }, " — " + x("readonly")) : null),
      el("div", { class: "grid" },
        el("label", {}, L ? "WhatsApp del dueño (alertas)" : "Owner WhatsApp (alerts)", inp("s-owner", a.owner_whatsapp, { placeholder: "51987654321" })),
        el("label", {}, L ? "Nombre del agente" : "Agent name", inp("s-bot", a.bot_name)), el("label", {}, L ? "Asesor" : "Advisor", inp("s-adv", a.advisor_name)),
        el("label", {}, L ? "Dirección" : "Address", inp("s-addr", a.address)),
        el("label", {}, L ? "Idioma por defecto" : "Default language", el("select", { id: "s-lang", disabled: ro }, ...["es", "en"].map((l) => el("option", { value: l, selected: a.default_language === l }, l.toUpperCase())))),
        el("label", {}, L ? "Visitas desde" : "Visits from", inp("s-v1", a.visiting_hours.inicio, { type: "time" })), el("label", {}, L ? "hasta" : "until", inp("s-v2", a.visiting_hours.fin, { type: "time" })),
        el("label", {}, L ? "Silencio nocturno desde" : "Quiet hours from", inp("s-q1", a.quiet_hours.start, { type: "time" })), el("label", {}, L ? "hasta" : "until", inp("s-q2", a.quiet_hours.end, { type: "time" }))),
      el("fieldset", { class: "dias" }, el("legend", {}, L ? "Días de visita" : "Visit days"),
        ...DIAS.map((dd) => el("label", {}, el("input", { type: "checkbox", id: `s-d-${dd}`, checked: a.visiting_hours.dias.includes(dd), disabled: ro }), " ", dd))),
      el("label", {}, L ? "Frases prohibidas (una por línea)" : "Forbidden phrases (one per line)", el("textarea", { id: "s-forb", rows: 4, disabled: ro }, a.forbidden_phrases.join("\n"))),
      ...seg,
      a.crm_type !== "peruptd_native" ? el("details", {}, el("summary", {}, (L ? "Mapeo de campos del CRM " : "CRM field mapping ") + `(${a.crm_type})`),
        el("textarea", { id: "s-map", rows: 12, class: "mono", disabled: ro }, JSON.stringify(a.crm_field_mapping, null, 2))) : null,
      esAdmin() ? el("div", { class: "controls" }, el("button", { class: "btn primary small", type: "submit" }, x("save"))) : null);
    return form;
  }

  async function iniciar() {
    marco();
    try { await cargar(); } catch (e) { pantallaLogin(); }
  }
  return { iniciar, C };
})();

// /app (served by Flask, no ?demo=1) = production CRM; anything else = recording demo.
const MODO_CRM = /^https?:/.test(location.protocol) && /\/app\/?$/.test(location.pathname) && !new URLSearchParams(location.search).has("demo");

</script>
